<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WTC Voice Assistant</title>
<meta name="theme-color" content="#5A3E8F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="WTC Voice">
<style>
:root{--bg:#F6F3FA;--card:#FFFFFF;--fg:#1E1A26;--mut:#6B6577;--line:#E3DDEC;--pur:#5A3E8F;--red:#C42D4E;--me:#5A3E8F;--meFg:#fff;--err:#FDECEC;--errFg:#8A1C1C;--errLine:#F3B4B4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111D;--card:#221C2E;--fg:#F1EDF7;--mut:#A79FB5;--line:#352C45;--me:#6C4FA6;--err:#3A1C22;--errFg:#FFC9CF;--errLine:#6B2B36}}
:root[data-theme="dark"]{--bg:#15111D;--card:#221C2E;--fg:#F1EDF7;--mut:#A79FB5;--line:#352C45;--me:#6C4FA6;--err:#3A1C22;--errFg:#FFC9CF;--errLine:#6B2B36}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Nastaliq Urdu","Noto Sans Bengali",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(135deg,var(--pur),var(--red));color:#fff}
header img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
header .t{flex:1;min-width:0}
header b{display:block;font-size:17px;line-height:1.2}
header small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:19px;padding:0}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.me,.bot{max-width:88%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--meFg);border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bot ul{margin:8px 0 0;padding:8px 8px 0 20px;border-top:1px dashed var(--line);font-size:14px;color:var(--mut)}
.bot li{margin-bottom:4px}
.bot .act{margin-top:8px}
.bot .act button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:13px}
.err{background:var(--err);border-color:var(--errLine);color:var(--errFg)}
.hello{text-align:center;color:var(--mut);font-size:15px;padding:10px 6px 2px}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tips button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 13px;font-size:14px}
#st{min-height:24px;text-align:center;font-size:14px;font-weight:700;color:var(--pur);padding:0 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #st{color:#C9B6EE}}
#st button{margin-left:8px;background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:2px 12px;font-size:13px}
.dock{padding:6px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:36px;box-shadow:0 6px 18px rgba(196,45,78,.45);transition:transform .15s}
#mic:active{transform:scale(.95)}
#mic.on{background:#B3261E;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,45,78,.6)}50%{box-shadow:0 0 0 18px rgba(196,45,78,0)}}
.miclbl{font-size:13px;color:var(--mut);margin-top:-4px}
.row{display:flex;gap:8px;width:100%}
#q{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font-size:16px}
#send{flex:none;width:48px;border-radius:14px;border:0;background:var(--pur);color:#fff;font-size:18px}
.dots::after{content:'…';display:inline-block;animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
/* setup + settings */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 4px;font-size:20px}
.panel p{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.45}
.panel label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.panel input,.panel select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:16px}
.panel .btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--pur);color:#fff;font-size:16px;font-weight:700}
.panel .btn2{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font-size:15px}
.panel .msg{margin-top:10px;font-size:14px;color:var(--errFg);min-height:20px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.brand img{width:52px;height:52px;border-radius:50%}
@media (prefers-reduced-motion:reduce){#mic.on,.dots::after{animation:none}}
</style></head>

<script>
var $=function(s){return document.querySelector(s)};
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(k,d){try{var v=localStorage.getItem('wtcv_'+k);return v==null?d:v}catch(e){return d}}
function put(k,v){try{if(v==null)localStorage.removeItem('wtcv_'+k);else localStorage.setItem('wtcv_'+k,v)}catch(e){}}

/* ---------- talking to the Google Sheet ---------- */
function api(fn){var args=[].slice.call(arguments,1);
 return fetch(A.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .catch(function(e){return{ok:false,error:navigator.onLine===false?'No internet connection.':'Could not reach the Google Sheet. Check the web app link in ⚙ Settings, and that the web app is deployed for "Anyone".'}})}

/* ---------- chat ---------- */
function st(t,stop){$('#st').innerHTML=t?'<span class="dots">'+E(t)+'</span>'+(stop?'<button id="stop">Stop</button>':''):''}
function scrollEnd(){var l=$('#log');l.scrollTop=l.scrollHeight}
function add(cls,html){var h=$('#log .hello');if(h){h.remove();var t=$('#log .tips');if(t)t.remove()}var d=document.createElement('div');d.className=cls;d.innerHTML=html;$('#log').appendChild(d);scrollEnd();return d}
function hello(){$('#log').innerHTML='<div class="hello">👋 Tap <b>🎙</b> and ask anything about your sites, stock, tasks, rentals, excess materials or PPE.</div><div class="tips">'+TIPS.map(function(t){return'<button data-tip="'+E(t)+'">'+E(t)+'</button>'}).join('')+'</div>'}
async function ask(text,audio){text=String(text||'').trim();if((!text&&!audio)||A.busy)return;quiet();unlock();$('#q').value='';
 var me=add('me',audio?'🎙 <i>…</i>':E(text));A.busy=true;st(audio?'Listening to your question':'Checking your data');
 var r=await api('aiAsk',A.pin,text,A.hist,audio||null);A.busy=false;st('');
 if(r&&r.heard)me.innerHTML=E(r.heard);else if(audio)me.innerHTML='🎙 (voice question)';
 if(!r||!r.ok){add('bot err','⚠ '+E((r&&r.error)||'Something went wrong.'));if(r&&/PIN/.test(r.error||''))showSetup();return}
 A.hist.push({q:r.heard||text||'(voice)',a:r.say});if(A.hist.length>6)A.hist.shift();
 var d=add('bot','<div>'+E(r.say)+'</div>'+(r.show&&r.show.length?'<ul>'+r.show.map(function(s){return'<li>'+E(s)+'</li>'}).join('')+'</ul>':'')+'<div class="act"><button data-again>🔊 Play again</button></div>');
 d.querySelector('[data-again]').onclick=function(){quiet();unlock();speak(r.say)};
 speak(r.say)}

/* ---------- sound out ---------- */
function unlock(){try{if(!A.ctx){var C=window.AudioContext||window.webkitAudioContext;if(C)A.ctx=new C()}if(A.ctx.state==='suspended')A.ctx.resume();var b=A.ctx.createBuffer(1,1,22050),s=A.ctx.createBufferSource();s.buffer=b;s.connect(A.ctx.destination);s.start(0)}catch(e){}
 try{if(window.speechSynthesis&&!A.sp){A.sp=1;var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
function quiet(){try{if(A.src){A.src.onended=null;A.src.stop()}}catch(e){}A.src=null;try{speechSynthesis.cancel()}catch(e){}A.n++;if(!A.busy&&!A.rec&&!A.mr)st('')}
function wav(pcm16,rate){var n=pcm16.length*2,b=new ArrayBuffer(44+n),v=new DataView(b),w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n,true);
 new Int16Array(b,44).set(pcm16);return new Uint8Array(b)}
function b64ToBytes(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function bytesToB64(u){var s='',k=0x8000;for(var i=0;i<u.length;i+=k)s+=String.fromCharCode.apply(null,u.subarray(i,i+k));return btoa(s)}
function play(b64,mime,n){return new Promise(function(res,rej){try{var u=b64ToBytes(b64);
 if(!/wav/i.test(mime||'')){var m=/rate=(\d+)/.exec(mime||'');u=wav(new Int16Array(u.buffer,0,u.length>>1),m?+m[1]:24000)}
 A.ctx.resume();A.ctx.decodeAudioData(u.buffer,function(buf){if(n!==A.n)return res();var s=A.ctx.createBufferSource();s.buffer=buf;s.connect(A.ctx.destination);s.onended=function(){if(A.src===s){A.src=null;st('')}res()};A.src=s;s.start(0)},function(){rej('decode')})}catch(e){rej(e)}})}
function phoneVoice(text,n){return new Promise(function(res){if(!window.speechSynthesis||n!==A.n)return res();

 if(/[ঀ-৿]/.test(text))want='bn';else if(/[ऀ-ॿ]/.test(text))want='hi';else if(/[؀-ۿ]/.test(text)&&want!=='ar')want='ur';
 var vs=all.filter(function(v){return(v.lang||'').slice(0,2).toLowerCase()===want});if(!vs.length&&want==='ur')vs=all.filter(function(v){return/^hi/i.test(v.lang)});
 var sc=function(v){return(/natural|neural|premium|enhanced|siri/i.test(v.name)?4:0)+(/google/i.test(v.name)?3:0)+(v.localService?0:1)};vs.sort(function(a,b){return sc(b)-sc(a)});
 var u=new SpeechSynthesisUtterance(text);if(vs[0]){u.voice=vs[0];u.lang=vs[0].lang}else u.lang=lang;u.rate=.97;u.onend=u.onerror=function(){st('');res()};speechSynthesis.cancel();speechSynthesis.speak(u)})}
async function speak(text){var v=$('#voice').value,n=++A.n;if(v==='off'||!text)return;
 if(v!=='phone'){st('Getting the voice ready',true);var r=await api('aiVoice',A.pin,text,v);if(n!==A.n)return;
  if(r&&r.ok){st('Speaking',true);try{await play(r.data,r.mime,n);return}catch(e){}}}
 if(n!==A.n)return;st('Speaking',true);await phoneVoice(text,n)}

/* ---------- microphone ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function micOn(on,lbl){$('#mic').classList.toggle('on',on);$('#miclbl').textContent=lbl||(on?'Listening… tap to stop':'Tap and speak')}
function listen(){quiet();unlock();if(A.rec){try{A.rec.stop()}catch(e){}return}if(A.mr){stopRec();return}
 if(SR&&A.sr)return listenSR();return record()}
function listenSR(){var r=new SR(),got='',failed=false;A.rec=r;r.lang=$('#lang').value;r.interimResults=true;r.continuous=false;
 r.onstart=function(){micOn(true);st('')};
 r.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;got=t;$('#q').value=t};
 r.onerror=function(e){if(e.error==='not-allowed'&&!navigator.mediaDevices){failed=true;add('bot err','🎙 Please allow the microphone for this page in your browser settings.')}
  else if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='network'||e.error==='language-not-supported'){failed=true;A.sr=false;put('sr','0');setTimeout(record,50)}};
 r.onend=function(){A.rec=null;micOn(false);if(!failed&&got.trim())ask(got)};
 try{r.start()}catch(e){A.rec=null;A.sr=false;record()}}
/* recording mode: works where the phone's speech typing is not available – Gemini listens to the recording */
async function record(){if(!navigator.mediaDevices||!window.MediaRecorder){add('bot err','🎙 This browser cannot use the microphone. Please type your question.');return}
 var stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){add('bot err','🎙 The microphone is not allowed. Allow it for this page in your phone settings, then try again.');return}
 var chunks=[],mr=new MediaRecorder(stream);A.mr=mr;A.stream=stream;micOn(true,'Listening… tap to stop');
 mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});clearInterval(A.vad);A.mr=null;micOn(false);
  var blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});if(blob.size<2000||!A.spoke){st('');return}
  st('Preparing your question');try{ask('',await toWav(blob))}catch(e){var b=new Uint8Array(await blob.arrayBuffer());ask('',{mime:(blob.type||'audio/webm').split(';')[0],data:bytesToB64(b)})}};
 mr.start(250);A.spoke=false;
 /* stop by itself after you finish speaking */
 try{var an=A.ctx.createAnalyser(),srcN=A.ctx.createMediaStreamSource(stream),buf=new Uint8Array(an.fftSize),quietMs=0,t0=Date.now();srcN.connect(an);
  A.vad=setInterval(function(){an.getByteTimeDomainData(buf);var m=0;for(var i=0;i<buf.length;i++)m=Math.max(m,Math.abs(buf[i]-128));
   if(m>14){A.spoke=true;quietMs=0}else quietMs+=100;
   if((A.spoke&&quietMs>1600)||Date.now()-t0>45000||(!A.spoke&&Date.now()-t0>8000))stopRec()},100)}catch(e){A.spoke=true}}
function stopRec(){if(A.mr&&A.mr.state!=='inactive')A.mr.stop()}
async function toWav(blob){var ab=await blob.arrayBuffer(),buf=await new Promise(function(res,rej){A.ctx.decodeAudioData(ab,res,rej)});
 var rate=16000,len=Math.ceil(buf.duration*rate),O=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new O(1,len,rate),s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start(0);
 var out=await oc.startRendering(),f=out.getChannelData(0),p=new Int16Array(f.length);for(var i=0;i<f.length;i++){var x=Math.max(-1,Math.min(1,f[i]));p[i]=x<0?x*32768:x*32767}
 return{mime:'audio/wav',data:bytesToB64(wav(p,rate))}}

/* ---------- setup & settings ---------- */
function showSetup(){$('#url').value=A.url;$('#pin').value='';$('#smsg').textContent='';$('#setup').hidden=false}
$('#connect').onclick=async function(){var u=$('#url').value.trim(),p=$('#pin').value.trim();
 if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){$('#smsg').textContent='Paste the full web app link – it starts with https://script.google.com/ and ends with /exec';return}
 if(!p){$('#smsg').textContent='Type the office PIN.';return}
 this.disabled=true;$('#smsg').textContent='Connecting…';A.url=u;var r=await api('aiPing',p);this.disabled=false;
 if(!r.ok){$('#smsg').textContent='⚠ '+r.error;return}
 if(!r.ready){$('#smsg').textContent='⚠ Connected, but the AI is not set up yet. In the Google Sheet: WTC Stock › 🤖 AI voice assistant – set Gemini key.';return}
 A.pin=p;put('url',u);put('pin',p);$('#setup').hidden=true;api('aiWarm',A.pin)};
$('#gear').onclick=function(){$('#sets').hidden=false};
$('#setok').onclick=function(){$('#sets').hidden=true};
$('#sets').onclick=function(e){if(e.target===this)this.hidden=true};
$('#signout').onclick=function(){put('pin',null);A.pin='';A.hist=[];hello();$('#sets').hidden=true;showSetup()};
$('#lang').value=get('lang','en-GB');$('#voice').value=get('voice','Kore');$('#theme').value=get('theme','');
function theme(){var t=$('#theme').value;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}theme();
$('#lang').onchange=function(){put('lang',this.value);A.sr=true;put('sr','1')};$('#voice').onchange=function(){put('voice',this.value);quiet()};$('#theme').onchange=function(){put('theme',this.value);theme()};
$('#mic').onclick=listen;$('#send').onclick=function(){ask($('#q').value)};
$('#q').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();ask(this.value)}};
$('#log').onclick=function(e){var b=e.target.closest('[data-tip]');if(b)ask(b.dataset.tip)};
$('#st').onclick=function(e){if(e.target.id==='stop')quiet()};
$('#newc').onclick=function(){quiet();A.hist=[];hello()};
try{speechSynthesis.getVoices()}catch(e){}
hello();if(!A.url||!A.pin)showSetup();else api('aiWarm',A.pin);
